# cordis.yml — DSH Cordis 插件树配置
#
# 此配置文件在 OpenOmniBot 启动时由 DSH 的 Cordis Loader 加载。
# 定义了需要加载的插件及其配置。
#
# 路径: 在 APK 中解压到应用私有目录，由 DshBridge init 时指定

# ============================================================
# 全局设置
# ============================================================

settings:
  logger:
    level: info

# ============================================================
# 插件加载
# ============================================================

plugins:

  # ---- Agent Loop ----
  # DSH 的核心 Agent 决策循环
  - id: '@deepseek-ai/dsh-agent-loop'
    config:
      agent:
        maxIterations: 50
        maxToolCalls: 30

  # ---- LLM 插件 ----
  # 大语言模型调用，复用 DSH 的 llm 插件配置
  - id: '@deepseek-ai/dsh-llm'
    config:
      provider: openai
      # 由 OpenOmniBot 的配置动态注入
      apiKey: '${env:OMNIBOT_LLM_API_KEY}'
      baseUrl: '${env:OMNIBOT_LLM_BASE_URL}'
      model: '${env:OMNIBOT_LLM_MODEL}'

  # ---- 工具系统 ----
  - id: '@deepseek-ai/dsh-tools'
    config:
      # 允许调用的工具列表
      whitelist:
        - vlm_operate
        - browser_control
        - filesystem
        - terminal_execute
        - scheduler

  # ---- 系统提示 ----
  - id: '@deepseek-ai/dsh-system-prompt'
    config:
      prompt: |
        You are an AI assistant running on an Android device.
        You can see the screen, control the browser, access the filesystem,
        execute terminal commands, and manage schedules.
        Use the available tools to help the user complete their tasks.

  # ---- 会话管理 ----
  - id: '@deepseek-ai/dsh-session'
    config:
      maxHistory: 50
      persistPath: '${dataDir}/sessions'

  # ---- Omnibot Android 适配器 (自定义插件) ----
  - id: '@omnibot/adapter'
    source: './plugins/omnibot-adapter'

# ============================================================
# 环境变量
# ============================================================

env:
  dataDir: '${appDataDir}/dsh'
  dshHome: '${appDataDir}/.dsh'