# ============================================================
# lint-check.yml — 代码质量与格式检查
#
# 检查 C 代码格式、Markdown 文档格式、YAML 配置格式。
# ============================================================

name: Code Quality Check

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/lint-check.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📝 Check Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'
          config: |
            {
              "MD013": { "line_length": 120 },
              "MD033": false,
              "MD041": false
            }

      - name: 🧹 Check YAML files
        run: |
          sudo apt-get install -y yamllint
          yamllint .github/workflows/ src/config/

      - name: 🔍 Check C code formatting
        uses: DoozyX/clang-format-lint-action@v0.18
        with:
          source: './src/bridge'
          extensions: 'c,h'
          clangFormatVersion: 18

      - name: ✅ Summary
        run: |
          echo "## ✅ 代码质量检查通过" >> $GITHUB_STEP_SUMMARY
          echo "- Markdown 格式 ✓" >> $GITHUB_STEP_SUMMARY
          echo "- YAML 格式 ✓" >> $GITHUB_STEP_SUMMARY
          echo "- C 代码格式 ✓" >> $GITHUB_STEP_SUMMARY